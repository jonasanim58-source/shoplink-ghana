<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seller Setup — ShopLink Ghana</title>
<link rel="stylesheet" href="/styles.css">
</head>

<body>

<header>
  <div class="wrap nav">
    <a class="logo" href="/">ShopLink Ghana</a>
    <a href="/">Home</a>
  </div>
</header>

<main class="wrap section">

  <span class="eyebrow">SELLER SETUP</span>

  <h1>Create your business shop</h1>
  <p>Enter your details and get a unique shop link.</p>

  <form id="bf" class="form">

    <label>
      Business name
      <input id="name" required placeholder="e.g. Jonas Phones">
    </label>

    <label>
      WhatsApp number
      <input id="wa" required placeholder="0241234567">
    </label>

    <label>
      Location
      <input id="loc" placeholder="Kumasi, Ghana">
    </label>

    <label>
      Opening hours
      <input id="hours" placeholder="Mon–Sat, 8 AM–7 PM">
    </label>

    <label>
      Description
      <textarea id="desc"></textarea>
    </label>

    <button class="btn" type="submit">Create shop</button>

  </form>

  <div id="result" class="result hidden"></div>

  <section id="ps" class="hidden">

    <h2>Add products</h2>

    <form id="pf" class="form">

      <label>
        Product name
        <input id="pn" required>
      </label>

      <label>
        Price (GH₵)
        <input id="price" type="number" min="0" required>
      </label>

      <label>
        Image URL
        <input id="img" placeholder="https://...">
      </label>

      <label>
        Description
        <textarea id="pd"></textarea>
      </label>

      <button class="btn" type="submit">Add product</button>

    </form>

    <div id="list"></div>

  </section>

</main>

<script>

let current = null;

const bf = document.getElementById("bf");
const pf = document.getElementById("pf");

const result = document.getElementById("result");
const ps = document.getElementById("ps");
const list = document.getElementById("list");

bf.onsubmit = async function(e) {

  e.preventDefault();

  try {

    const response = await fetch("/api/businesses", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        name: document.getElementById("name").value,
        whatsapp: document.getElementById("wa").value,
        location: document.getElementById("loc").value,
        hours: document.getElementById("hours").value,
        description: document.getElementById("desc").value
      })
    });

    const data = await response.json();

    if (!response.ok) {
      alert(data.error || "Could not create shop.");
      return;
    }

    current = data.business;

    result.classList.remove("hidden");

    result.innerHTML = `
      <h3>Shop created 🎉</h3>

      <p>
        <a target="_blank" href="/shop/${current.slug}">
          Open your shop
        </a>
      </p>

      <p>
        <strong>Share your shop:</strong><br>
        ${location.origin}/shop/${current.slug}
      </p>

      <button class="btn" type="button" onclick="copyShopLink()">
        Copy shop link
      </button>
    `;

    ps.classList.remove("hidden");

  } catch (error) {

    console.error(error);
    alert("Something went wrong. Please try again.");

  }

};


pf.onsubmit = async function(e) {

  e.preventDefault();

  if (!current) {
    alert("Create your shop first.");
    return;
  }

  try {

    const response = await fetch("/api/products", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        businessId: current.id,
        name: document.getElementById("pn").value,
        price: document.getElementById("price").value,
        image: document.getElementById("img").value,
        description: document.getElementById("pd").value
      })
    });

    const data = await response.json();

    if (!response.ok) {
      alert(data.error || "Could not add product.");
      return;
    }

    document.getElementById("pn").value = "";
    document.getElementById("price").value = "";
    document.getElementById("img").value = "";
    document.getElementById("pd").value = "";

    loadProducts();

  } catch (error) {

    console.error(error);
    alert("Something went wrong.");

  }

};


async function loadProducts() {

  if (!current) return;

  try {

    const response = await fetch(
      "/api/business/" + current.slug
    );

    const data = await response.json();

    if (!response.ok) {
      list.innerHTML = "<p>Unable to load products.</p>";
      return;
    }

    if (!data.products.length) {

      list.innerHTML = "<p>No products added yet.</p>";

      return;
    }

    list.innerHTML = data.products.map(function(p) {

      return `
        <div class="list-item">
          <span>
            <b>${escapeHtml(p.name)}</b>
            — GH₵${p.price}
          </span>

          <button
            type="button"
            onclick="deleteProduct('${p.id}')">
            Delete
          </button>
        </div>
      `;

    }).join("");

  } catch (error) {

    console.error(error);

    list.innerHTML = "<p>Unable to load products.</p>";

  }

}


async function deleteProduct(id) {

  await fetch("/api/products/" + id, {
    method: "DELETE"
  });

  loadProducts();

}


async function copyShopLink() {

  if (!current) return;

  const shopLink =
    location.origin + "/shop/" + current.slug;

  try {

    await navigator.clipboard.writeText(shopLink);

    alert("Shop link copied!");

  } catch {

    alert(shopLink);

  }

}


function escapeHtml(text) {

  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

</script>

</body>
</html>
