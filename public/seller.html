<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seller Setup — ShopLink Ghana</title><link rel="stylesheet" href="/styles.css"></head><body><header><div class="wrap nav"><a class="logo" href="/">ShopLink Ghana</a><a href="/">Home</a></div></header><main class="wrap section"><span class="eyebrow">SELLER SETUP</span><h1>Create your business shop</h1><p>Enter your details and get a unique shop link.</p><form id="bf" class="form"><label>Business name<input id="name" required placeholder="e.g. Jonas Phones"></label><label>WhatsApp number<input id="wa" required placeholder="0241234567"></label><label>Location<input id="loc" placeholder="Kumasi, Ghana"></label><label>Opening hours<input id="hours" placeholder="Mon–Sat, 8 AM–7 PM"></label><label>Description<textarea id="desc"></textarea></label><button class="btn">Create shop</button></form><div id="result" class="result hidden"></div><section id="ps" class="hidden"><h2>Add products</h2><form id="pf" class="form"><label>Product name<input id="pn" required></label><label>Price (GH₵)<input id="price" type="number" min="0" required></label><label>Image URL<input id="img" placeholder="https://..."></label><label>Description<textarea id="pd"></textarea></label><button class="btn">Add product</button></form><div id="list"></div></section></main><script>
let current;bf.onsubmit=async x=>{x.preventDefault();let r=await fetch("/api/businesses",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:name.value,whatsapp:wa.value,location:loc.value,hours:hours.value,description:desc.value})}),d=await r.json();if(!r.ok)return alert(d.error);current=d.business;result.classList.remove("hidden");result.innerHTML="<h3>Shop created 🎉</h3><p><a target='_blank' href='/shop/"+current.slug+"'>Open your shop</a></p><p>Share: "+location.origin+"/shop/"+current.slug+"</p>";ps.classList.remove("hidden")};
pf.onsubmit=async x=>{x.preventDefault();let r=await fetch("/api/products",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({businessId:current.id,name:pn.value,price:price.value,image:img.value,description:pd.value})}),d=await r.json();if(!r.ok)return alert(d.error);pn.value=price.value=img.value=pd.value="";load()};async function load(){let d=await (await fetch("/api/business/"+current.slug)).json();list.innerHTML=d.products.map(p=>"<div class='list-item'><span><b>"+p.name+"</b> — GH₵"+p.price+"</span><button onclick="del('"+p.id+"')">Delete</button></div>").join("")}async function del(id){await fetch("/api/products/"+id,{method:"DELETE"});load()}
</script></body></html>
