<!doctype html>
<html>

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Seller Dashboard — ShopLink Ghana</title>

<link
  rel="stylesheet"
  href="/styles.css"
>

<style>

.hidden {
  display: none !important;
}

.dashboard-card {
  background: white;
  padding: 20px;
  border-radius: 14px;
  margin-top: 20px;
  box-shadow: 0 4px 20px rgba(0,0,0,.06);
}

.product-card {
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 15px;
  margin-top: 15px;
}

.product-card img {
  width: 100%;
  max-width: 220px;
  height: 160px;
  object-fit: cover;
  border-radius: 10px;
}

.actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 12px;
}

.edit-box {
  background: #f5f5f5;
  padding: 15px;
  border-radius: 10px;
  margin-top: 15px;
}

</style>

</head>


<body>


<header>

<div class="wrap nav">

<a
  class="logo"
  href="/"
>
ShopLink Ghana
</a>

<a href="/">
Home
</a>

</div>

</header>


<main class="wrap section">


<!-- LOGIN -->

<section id="loginSection">

<span class="eyebrow">
SELLER LOGIN
</span>

<h1>
Seller Dashboard
</h1>

<p>
Login to manage your shop.
</p>


<form
  id="loginForm"
  class="form"
>

<label>

Shop link

<input
  id="loginSlug"
  required
  placeholder="accra-style-hub"
>

</label>


<label>

Password

<input
  id="loginPassword"
  type="password"
  required
  placeholder="Your password"
>

</label>


<button
  class="btn"
  type="submit"
>
Login
</button>

</form>

</section>



<!-- CREATE SHOP -->

<section id="createSection">

<h2>
Create a new shop
</h2>


<form
  id="businessForm"
  class="form"
>


<label>

Business name

<input
  id="name"
  required
  placeholder="e.g. Jonas Phones"
>

</label>


<label>

WhatsApp number

<input
  id="wa"
  required
  placeholder="0241234567"
>

</label>


<label>

Location

<input
  id="loc"
  placeholder="Kumasi, Ghana"
>

</label>


<label>

Opening hours

<input
  id="hours"
  placeholder="Mon–Sat, 8 AM–7 PM"
>

</label>


<label>

Description

<textarea id="desc"></textarea>

</label>


<label>

Seller password

<input
  id="createPassword"
  type="password"
  minlength="6"
  required
  placeholder="At least 6 characters"
>

</label>


<button
  class="btn"
  type="submit"
>
Create shop
</button>

</form>

</section>



<!-- DASHBOARD -->

<section
  id="dashboard"
  class="hidden"
>


<div class="dashboard-card">

<h1 id="shopName"></h1>

<p id="shopInfo"></p>

<p>

<a
  id="shopLink"
  target="_blank"
>
Open public shop
</a>

</p>


<button
  type="button"
  onclick="logout()"
>
Log out
</button>

</div>



<!-- ADD PRODUCT -->

<div class="dashboard-card">

<h2>
Add product
</h2>


<form
  id="productForm"
  class="form"
>


<label>

Product name

<input
  id="pn"
  required
>

</label>


<label>

Price (GH₵)

<input
  id="price"
  type="number"
  min="0"
  required
>

</label>


<label>

Image URL

<input
  id="img"
  placeholder="https://..."
>

</label>


<label>

Description

<textarea id="pd"></textarea>

</label>


<button
  class="btn"
  type="submit"
>
Add product
</button>

</form>

</div>



<!-- PRODUCTS -->

<div class="dashboard-card">

<h2>
Your products
</h2>

<div id="list"></div>

</div>


</section>


</main>



<script>


/* =========================
   IMPORTANT:
   NO AUTOMATIC LOGIN
========================= */

let token = null;

let currentBusiness = null;


const loginSection =
  document.getElementById(
    "loginSection"
  );


const createSection =
  document.getElementById(
    "createSection"
  );


const dashboard =
  document.getElementById(
    "dashboard"
  );


const list =
  document.getElementById(
    "list"
  );



/* =========================
   LOGIN
========================= */

document
  .getElementById("loginForm")
  .onsubmit =
  async function(e) {

    e.preventDefault();

    const slug =
      document
        .getElementById(
          "loginSlug"
        )
        .value
        .trim();

    const password =
      document
        .getElementById(
          "loginPassword"
        )
        .value;

    try {

      const response =
        await fetch(
          "/api/login",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({
                slug,
                password
              })
          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        alert(
          data.error ||
          "Login failed."
        );

        return;
      }


      token =
        data.token;

      currentBusiness =
        data.business;


      document
        .getElementById(
          "loginPassword"
        )
        .value = "";


      showDashboard();


    } catch(error) {

      console.error(error);

      alert(
        "Could not connect to server."
      );

    }

  };



/* =========================
   CREATE SHOP
========================= */

document
  .getElementById("businessForm")
  .onsubmit =
  async function(e) {

    e.preventDefault();


    const password =
      document
        .getElementById(
          "createPassword"
        )
        .value;


    try {

      const response =
        await fetch(
          "/api/businesses",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({

                name:
                  document
                    .getElementById(
                      "name"
                    )
                    .value,

                whatsapp:
                  document
                    .getElementById(
                      "wa"
                    )
                    .value,

                location:
                  document
                    .getElementById(
                      "loc"
                    )
                    .value,

                hours:
                  document
                    .getElementById(
                      "hours"
                    )
                    .value,

                description:
                  document
                    .getElementById(
                      "desc"
                    )
                    .value,

                password

              })
          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        alert(
          data.error ||
          "Could not create shop."
        );

        return;
      }


      token =
        data.token;

      currentBusiness =
        data.business;


      alert(
        "Shop created successfully!"
      );


      showDashboard();


    } catch(error) {

      console.error(error);

      alert(
        "Something went wrong."
      );

    }

  };



/* =========================
   DASHBOARD
========================= */

function showDashboard() {

  loginSection.classList.add(
    "hidden"
  );

  createSection.classList.add(
    "hidden"
  );

  dashboard.classList.remove(
    "hidden"
  );


  document.getElementById(
    "shopName"
  ).textContent =
    currentBusiness.name;


  document.getElementById(
    "shopInfo"
  ).textContent =
    currentBusiness.location;


  document.getElementById(
    "shopLink"
  ).href =
    "/shop/" +
    currentBusiness.slug;


  loadProducts();

}



/* =========================
   ADD PRODUCT
========================= */

document
  .getElementById("productForm")
  .onsubmit =
  async function(e) {

    e.preventDefault();


    if (!token) {

      alert(
        "Please login first."
      );

      return;
    }


    try {

      const response =
        await fetch(
          "/api/products",
          {
            method: "POST",

            headers: {

              "Content-Type":
                "application/json",

              "Authorization":
                "Bearer " + token

            },

            body:
              JSON.stringify({

                name:
                  document
                    .getElementById(
                      "pn"
                    )
                    .value,

                price:
                  document
                    .getElementById(
                      "price"
                    )
                    .value,

                image:
                  document
                    .getElementById(
                      "img"
                    )
                    .value,

                description:
                  document
                    .getElementById(
                      "pd"
                    )
                    .value

              })
          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        alert(
          data.error ||
          "Could not add product."
        );

        return;
      }


      document
        .getElementById(
          "pn"
        )
        .value = "";

      document
        .getElementById(
          "price"
        )
        .value = "";

      document
        .getElementById(
          "img"
        )
        .value = "";

      document
        .getElementById(
          "pd"
        )
        .value = "";


      loadProducts();


    } catch(error) {

      console.error(error);

      alert(
        "Something went wrong."
      );

    }

  };



/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts() {

  if (!token) return;


  try {

    const response =
      await fetch(
        "/api/me",
        {
          headers: {
            "Authorization":
              "Bearer " + token
          }
        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      alert(
        data.error ||
        "Session expired."
      );

      logout();

      return;
    }


    renderProducts(
      data.products
    );


  } catch(error) {

    console.error(error);

    list.innerHTML =
      "<p>Unable to load products.</p>";

  }

}



/* =========================
   RENDER
========================= */

function renderProducts(
  products
) {

  if (!products.length) {

    list.innerHTML =
      "<p>No products added yet.</p>";

    return;
  }


  list.innerHTML =
    products
      .map(function(p) {

        return `

<div
  class="product-card"
  id="product-${p.id}"
>

<img
  src="${escapeHtml(p.image)}"
  alt="${escapeHtml(p.name)}"
>


<h3>
${escapeHtml(p.name)}
</h3>


<p>
<strong>
GH₵${p.price}
</strong>
</p>


<p>
${escapeHtml(
  p.description || ""
)}
</p>


<div class="actions">

<button
  class="btn"
  type="button"
  onclick="editProduct('${p.id}')"
>
Edit
</button>


<button
  type="button"
  onclick="deleteProduct('${p.id}')"
>
Delete
</button>

</div>


<div
  id="edit-${p.id}"
  class="edit-box hidden"
>

<label>
Product name

<input
  id="edit-name-${p.id}"
  value="${escapeHtml(p.name)}"
>

</label>


<label>
Price (GH₵)

<input
  id="edit-price-${p.id}"
  type="number"
  min="0"
  value="${p.price}"
>

</label>


<label>
Image URL

<input
  id="edit-image-${p.id}"
  value="${escapeHtml(p.image)}"
>

</label>


<label>
Description

<textarea
  id="edit-description-${p.id}"
>${escapeHtml(
  p.description || ""
)}</textarea>

</label>


<div class="actions">

<button
  class="btn"
  type="button"
  onclick="saveProduct('${p.id}')"
>
Save changes
</button>


<button
  type="button"
  onclick="cancelEdit('${p.id}')"
>
Cancel
</button>

</div>

</div>

</div>

`;

      })
      .join("");

}



/* =========================
   EDIT
========================= */

function editProduct(id) {

  document
    .getElementById(
      "edit-" + id
    )
    .classList.remove(
      "hidden"
    );

}


function cancelEdit(id) {

  document
    .getElementById(
      "edit-" + id
    )
    .classList.add(
      "hidden"
    );

}



/* =========================
   SAVE EDIT
========================= */

async function saveProduct(id) {

  if (!token) {

    alert(
      "Please login first."
    );

    return;
  }


  const name =
    document.getElementById(
      "edit-name-" + id
    ).value;


  const price =
    document.getElementById(
      "edit-price-" + id
    ).value;


  const image =
    document.getElementById(
      "edit-image-" + id
    ).value;


  const description =
    document.getElementById(
      "edit-description-" + id
    ).value;


  try {

    const response =
      await fetch(
        "/api/products/" + id,
        {
          method: "PUT",

          headers: {

            "Content-Type":
              "application/json",

            "Authorization":
              "Bearer " + token

          },

          body:
            JSON.stringify({
              name,
              price,
              image,
              description
            })
        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      alert(
        data.error ||
        "Could not update product."
      );

      return;
    }


    alert(
      "Product updated!"
    );


    loadProducts();


  } catch(error) {

    console.error(error);

    alert(
      "Something went wrong."
    );

  }

}



/* =========================
   DELETE
========================= */

async function deleteProduct(id) {

  if (
    !confirm(
      "Are you sure you want to delete this product?"
    )
  ) {
    return;
  }


  try {

    const response =
      await fetch(
        "/api/products/" + id,
        {
          method: "DELETE",

          headers: {
            "Authorization":
              "Bearer " + token
          }
        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      alert(
        data.error ||
        "Could not delete product."
      );

      return;
    }


    loadProducts();


  } catch(error) {

    console.error(error);

    alert(
      "Something went wrong."
    );

  }

}



/* =========================
   LOGOUT
========================= */

function logout() {

  token = null;

  currentBusiness = null;

  dashboard.classList.add(
    "hidden"
  );

  loginSection.classList.remove(
    "hidden"
  );

  createSection.classList.remove(
    "hidden"
  );

  document
    .getElementById(
      "loginPassword"
    )
    .value = "";

}



/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(text) {

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

</script>

</body>

</html>
