<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Seller — ShopLink Ghana</title>

<link
  rel="stylesheet"
  href="/styles.css"
>

<style>

.dashboard-card {
  background: #fff;
  border: 1px solid #e5e7eb;
  border-radius: 16px;
  padding: 20px;
  margin-top: 20px;
}

.product-card {
  border: 1px solid #e5e7eb;
  border-radius: 14px;
  padding: 15px;
  margin-top: 15px;
}

.product-card img {
  width: 100%;
  max-width: 180px;
  height: 150px;
  object-fit: cover;
  border-radius: 10px;
  display: block;
  margin-bottom: 10px;
}

.actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 10px;
}

.edit-box {
  background: #f8fafc;
  border-radius: 12px;
  padding: 15px;
  margin-top: 12px;
}

.hidden {
  display: none !important;
}

.error {
  color: #b91c1c;
  background: #fee2e2;
  padding: 12px;
  border-radius: 10px;
  margin-top: 12px;
}

.success {
  color: #166534;
  background: #dcfce7;
  padding: 12px;
  border-radius: 10px;
  margin-top: 12px;
}

.small {
  font-size: 14px;
  color: #64748b;
}

</style>
</head>

<body>

<header>
  <div class="wrap nav">

    <a
      class="logo"
      href="/"
    >
      ShopLink Ghana
    </a>

    <a href="/">
      Home
    </a>

  </div>
</header>


<main class="wrap section">

  <!-- =====================
       LOGIN
  ====================== -->

  <section id="loginSection">

    <span class="eyebrow">
      SELLER LOGIN
    </span>

    <h1>
      Seller dashboard
    </h1>

    <p>
      Log in to manage your ShopLink Ghana store.
    </p>

    <form
      id="loginForm"
      class="form"
    >

      <label>
        Shop slug

        <input
          id="loginSlug"
          required
          placeholder="e.g. accra-style-hub"
          autocomplete="username"
        >
      </label>


      <label>
        Password

        <input
          id="loginPassword"
          type="password"
          required
          placeholder="Enter your password"
          autocomplete="current-password"
        >
      </label>


      <button
        class="btn"
        type="submit"
      >
        Login
      </button>

    </form>


    <div
      id="loginMessage"
      class="hidden"
    ></div>


    <p class="small">
      Don't have a shop yet?
      Create one below.
    </p>

  </section>


  <!-- =====================
       CREATE SHOP
  ====================== -->

  <section
    id="createSection"
    class="dashboard-card"
  >

    <span class="eyebrow">
      NEW SELLER
    </span>

    <h2>
      Create your shop
    </h2>

    <p>
      Create a new ShopLink Ghana store.
    </p>


    <form
      id="businessForm"
      class="form"
    >

      <label>
        Business name

        <input
          id="name"
          required
          placeholder="e.g. Jonas Phones"
        >
      </label>


      <label>
        WhatsApp number

        <input
          id="wa"
          required
          placeholder="0241234567"
        >
      </label>


      <label>
        Location

        <input
          id="loc"
          placeholder="Accra, Ghana"
        >
      </label>


      <label>
        Opening hours

        <input
          id="hours"
          placeholder="Mon–Sat, 9 AM–7 PM"
        >
      </label>


      <label>
        Description

        <textarea
          id="desc"
          placeholder="Tell customers about your business"
        ></textarea>
      </label>


      <label>
        Seller password

        <input
          id="createPassword"
          type="password"
          required
          minlength="6"
          placeholder="At least 6 characters"
          autocomplete="new-password"
        >
      </label>


      <label>
        Confirm password

        <input
          id="confirmPassword"
          type="password"
          required
          minlength="6"
          placeholder="Enter the password again"
          autocomplete="new-password"
        >
      </label>


      <button
        class="btn"
        type="submit"
      >
        Create shop
      </button>

    </form>


    <div
      id="createMessage"
      class="hidden"
    ></div>

  </section>


  <!-- =====================
       DASHBOARD
  ====================== -->

  <section
    id="dashboard"
    class="hidden"
  >

    <div class="dashboard-card">

      <span class="eyebrow">
        SELLER DASHBOARD
      </span>

      <h1 id="businessName">
        Your Shop
      </h1>

      <p id="businessInfo"></p>


      <div class="actions">

        <a
          id="openShop"
          class="btn"
          target="_blank"
        >
          Open shop
        </a>


        <button
          id="copyLink"
          class="btn"
          type="button"
        >
          Copy shop link
        </button>


        <button
          id="logoutBtn"
          type="button"
        >
          Logout
        </button>

      </div>

    </div>


    <!-- ADD PRODUCT -->

    <div class="dashboard-card">

      <h2>
        Add product
      </h2>

      <form
        id="productForm"
        class="form"
      >

        <label>
          Product name

          <input
            id="productName"
            required
            placeholder="e.g. Premium Sneakers"
          >
        </label>


        <label>
          Price (GH₵)

          <input
            id="productPrice"
            type="number"
            min="0"
            step="0.01"
            required
            placeholder="280"
          >
        </label>


        <label>
          Image URL

          <input
            id="productImage"
            placeholder="https://..."
          >
        </label>


        <label>
          Description

          <textarea
            id="productDescription"
            placeholder="Product description"
          ></textarea>
        </label>


        <button
          class="btn"
          type="submit"
        >
          Add product
        </button>

      </form>

    </div>


    <!-- PRODUCTS -->

    <div class="dashboard-card">

      <h2>
        Your products
      </h2>

      <div id="productList">
        Loading...
      </div>

    </div>

  </section>

</main>


<script>

let token = null;
let currentBusiness = null;


/* =========================
   ELEMENTS
========================= */

const loginSection =
  document.getElementById("loginSection");

const createSection =
  document.getElementById("createSection");

const dashboard =
  document.getElementById("dashboard");

const loginForm =
  document.getElementById("loginForm");

const businessForm =
  document.getElementById("businessForm");

const productForm =
  document.getElementById("productForm");

const loginMessage =
  document.getElementById("loginMessage");

const createMessage =
  document.getElementById("createMessage");

const productList =
  document.getElementById("productList");


/* =========================
   MESSAGE HELPERS
========================= */

function showMessage(element, text, type) {

  element.className =
    type === "error"
      ? "error"
      : "success";

  element.textContent = text;

}


/* =========================
   LOGIN
========================= */

loginForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    loginMessage.classList.add("hidden");

    const slug =
      document
        .getElementById("loginSlug")
        .value
        .trim()
        .toLowerCase();

    const password =
      document
        .getElementById("loginPassword")
        .value;

    try {

      const response =
        await fetch("/api/login", {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            slug: slug,
            password: password
          })

        });


      const data =
        await response.json();


      if (!response.ok) {

        showMessage(
          loginMessage,
          data.error ||
            "Incorrect shop or password.",
          "error"
        );

        loginMessage.classList.remove(
          "hidden"
        );

        return;
      }


      /*
        IMPORTANT:
        Token only exists after
        the server confirms the
        correct password.
      */

      token = data.token;

      currentBusiness =
        data.business;


      loginForm.reset();

      loginSection.classList.add(
        "hidden"
      );

      createSection.classList.add(
        "hidden"
      );

      dashboard.classList.remove(
        "hidden"
      );


      displayBusiness();

      loadProducts();

    } catch (error) {

      console.error(error);

      showMessage(
        loginMessage,
        "Unable to connect to the server.",
        "error"
      );

      loginMessage.classList.remove(
        "hidden"
      );
    }

  }
);


/* =========================
   CREATE SHOP
========================= */

businessForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    createMessage.classList.add(
      "hidden"
    );


    const password =
      document
        .getElementById("createPassword")
        .value;

    const confirmPassword =
      document
        .getElementById("confirmPassword")
        .value;


    if (password !== confirmPassword) {

      showMessage(
        createMessage,
        "Passwords do not match.",
        "error"
      );

      createMessage.classList.remove(
        "hidden"
      );

      return;
    }


    if (password.length < 6) {

      showMessage(
        createMessage,
        "Password must be at least 6 characters.",
        "error"
      );

      createMessage.classList.remove(
        "hidden"
      );

      return;
    }


    try {

      const response =
        await fetch(
          "/api/businesses",
          {

            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({

              name:
                document
                  .getElementById("name")
                  .value,

              whatsapp:
                document
                  .getElementById("wa")
                  .value,

              location:
                document
                  .getElementById("loc")
                  .value,

              hours:
                document
                  .getElementById("hours")
                  .value,

              description:
                document
                  .getElementById("desc")
                  .value,

              password:
                password

            })

          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        showMessage(
          createMessage,
          data.error ||
            "Could not create shop.",
          "error"
        );

        createMessage.classList.remove(
          "hidden"
        );

        return;
      }


      businessForm.reset();


      showMessage(
        createMessage,
        "Shop created successfully. Your shop slug is: " +
          data.business.slug +
          ". Now log in above using the password you just created.",
        "success"
      );

      createMessage.classList.remove(
        "hidden"
      );


      document
        .getElementById("loginSlug")
        .value =
        data.business.slug;


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    } catch (error) {

      console.error(error);

      showMessage(
        createMessage,
        "Something went wrong.",
        "error"
      );

      createMessage.classList.remove(
        "hidden"
      );
    }

  }
);


/* =========================
   DISPLAY BUSINESS
========================= */

function displayBusiness() {

  document.getElementById(
    "businessName"
  ).textContent =
    currentBusiness.name;


  document.getElementById(
    "businessInfo"
  ).textContent =
    currentBusiness.location +
    " • " +
    currentBusiness.hours;


  document.getElementById(
    "openShop"
  ).href =
    "/shop/" +
    currentBusiness.slug;

}


/* =========================
   COPY SHOP LINK
========================= */

document
  .getElementById("copyLink")
  .addEventListener(
    "click",
    async function() {

      const link =
        window.location.origin +
        "/shop/" +
        currentBusiness.slug;

      try {

        await navigator.clipboard.writeText(
          link
        );

        alert(
          "Shop link copied!"
        );

      } catch {

        alert(link);

      }

    }
  );


/* =========================
   ADD PRODUCT
========================= */

productForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    try {

      const response =
        await fetch(
          "/api/products",
          {

            method: "POST",

            headers: {

              "Content-Type":
                "application/json",

              "Authorization":
                "Bearer " + token

            },

            body: JSON.stringify({

              name:
                document
                  .getElementById(
                    "productName"
                  )
                  .value,

              price:
                document
                  .getElementById(
                    "productPrice"
                  )
                  .value,

              image:
                document
                  .getElementById(
                    "productImage"
                  )
                  .value,

              description:
                document
                  .getElementById(
                    "productDescription"
                  )
                  .value

            })

          }
        );


      const data =
        await response.json();


      if (response.status === 401) {

        forceLogout();

        return;
      }


      if (!response.ok) {

        alert(
          data.error ||
            "Could not add product."
        );

        return;
      }


      productForm.reset();

      loadProducts();

    } catch (error) {

      console.error(error);

      alert(
        "Something went wrong."
      );
    }

  }
);


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts() {

  productList.textContent =
    "Loading...";


  try {

    const response =
      await fetch(
        "/api/me",
        {

          headers: {
            "Authorization":
              "Bearer " + token
          }

        }
      );


    const data =
      await response.json();


    if (response.status === 401) {

      forceLogout();

      return;
    }


    if (!response.ok) {

      productList.textContent =
        data.error ||
        "Unable to load products.";

      return;
    }


    renderProducts(
      data.products
    );

  } catch (error) {

    console.error(error);

    productList.textContent =
      "Unable to load products.";
  }

}


/* =========================
   RENDER PRODUCTS
========================= */

function renderProducts(products) {

  if (!products.length) {

    productList.innerHTML =
      "<p>No products added yet.</p>";

    return;
  }


  productList.innerHTML =
    products.map(
      function(product) {

        return `

          <div
            class="product-card"
            data-id="${escapeHtml(product.id)}"
          >

            <img
              src="${escapeHtml(product.image)}"
              alt="${escapeHtml(product.name)}"
              onerror="this.style.display='none'"
            >

            <h3>
              ${escapeHtml(product.name)}
            </h3>

            <p>
              <strong>
                GH₵${Number(product.price).toFixed(2)}
              </strong>
            </p>

            <p>
              ${escapeHtml(
                product.description || ""
              )}
            </p>

            <div class="actions">

              <button
                type="button"
                onclick="showEdit('${escapeHtml(product.id)}')"
              >
                Edit
              </button>

              <button
                type="button"
                onclick="deleteProduct('${escapeHtml(product.id)}')"
              >
                Delete
              </button>

            </div>


            <div
              id="edit-${escapeHtml(product.id)}"
              class="edit-box hidden"
            >

              <label>
                Product name

                <input
                  id="edit-name-${escapeHtml(product.id)}"
                  value="${escapeHtml(product.name)}"
                >
              </label>


              <label>
                Price

                <input
                  id="edit-price-${escapeHtml(product.id)}"
                  type="number"
                  min="0"
                  step="0.01"
                  value="${Number(product.price)}"
                >
              </label>


              <label>
                Image URL

                <input
                  id="edit-image-${escapeHtml(product.id)}"
                  value="${escapeHtml(product.image || "")}"
                >
              </label>


              <label>
                Description

                <textarea
                  id="edit-description-${escapeHtml(product.id)}"
                >${escapeHtml(product.description || "")}</textarea>
              </label>


              <div class="actions">

                <button
                  class="btn"
                  type="button"
                  onclick="saveProduct('${escapeHtml(product.id)}')"
                >
                  Save changes
                </button>

                <button
                  type="button"
                  onclick="hideEdit('${escapeHtml(product.id)}')"
                >
                  Cancel
                </button>

              </div>

            </div>

          </div>

        `;
      }
    ).join("");

}


/* =========================
   SHOW EDIT
========================= */

function showEdit(id) {

  const box =
    document.getElementById(
      "edit-" + id
    );

  if (box) {
    box.classList.remove(
      "hidden"
    );
  }

}


/* =========================
   HIDE EDIT
========================= */

function hideEdit(id) {

  const box =
    document.getElementById(
      "edit-" + id
    );

  if (box) {
    box.classList.add(
      "hidden"
    );
  }

}


/* =========================
   SAVE PRODUCT
========================= */

async function saveProduct(id) {

  const name =
    document.getElementById(
      "edit-name-" + id
    ).value;

  const price =
    document.getElementById(
      "edit-price-" + id
    ).value;

  const image =
    document.getElementById(
      "edit-image-" + id
    ).value;

  const description =
    document.getElementById(
      "edit-description-" + id
    ).value;


  try {

    const response =
      await fetch(
        "/api/products/" + id,
        {

          method: "PUT",

          headers: {

            "Content-Type":
              "application/json",

            "Authorization":
              "Bearer " + token

          },

          body: JSON.stringify({

            name,
            price,
            image,
            description

          })

        }
      );


    const data =
      await response.json();


    if (response.status === 401) {

      forceLogout();

      return;
    }


    if (!response.ok) {

      alert(
        data.error ||
          "Could not save product."
      );

      return;
    }


    alert(
      "Product updated successfully."
    );

    loadProducts();

  } catch (error) {

    console.error(error);

    alert(
      "Something went wrong."
    );
  }

}


/* =========================
   DELETE PRODUCT
========================= */

async function deleteProduct(id) {

  const confirmed =
    confirm(
      "Delete this product?"
    );

  if (!confirmed) {
    return;
  }


  try {

    const response =
      await fetch(
        "/api/products/" + id,
        {

          method: "DELETE",

          headers: {

            "Authorization":
              "Bearer " + token

          }

        }
      );


    const data =
      await response.json();


    if (response.status === 401) {

      forceLogout();

      return;
    }


    if (!response.ok) {

      alert(
        data.error ||
          "Could not delete product."
      );

      return;
    }


    loadProducts();

  } catch (error) {

    console.error(error);

    alert(
      "Something went wrong."
    );
  }

}


/* =========================
   LOGOUT
========================= */

document
  .getElementById("logoutBtn")
  .addEventListener(
    "click",
    function() {

      forceLogout();

    }
  );


function forceLogout() {

  token = null;
  currentBusiness = null;

  dashboard.classList.add(
    "hidden"
  );

  loginSection.classList.remove(
    "hidden"
  );

  createSection.classList.remove(
    "hidden"
  );

  document
    .getElementById(
      "loginPassword"
    )
    .value = "";

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value) {

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}

</script>

</body>
</html>
