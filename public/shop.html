<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShopLink Shop</title><link rel="stylesheet" href="/styles.css"></head><body><header><div class="wrap nav"><a class="logo" href="/">ShopLink Ghana</a><a class="btn small" href="/seller">Create a shop</a></div></header><main class="wrap shop-page"><div id="head"></div><div class="search-row"><input id="search" placeholder="Search products…"><span id="count"></span></div><div id="grid" class="products"></div></main><div id="cart" class="cart hidden"><span><b id="cc">0</b> items · <b id="total">GH₵0.00</b></span><button class="btn small" onclick="checkout()">Order on WhatsApp</button></div><script>
let business,products=[],cart=[];const slug=location.pathname.split("/").filter(Boolean).pop();
async function init(){let r=await fetch("/api/business/"+slug);if(!r.ok){document.body.innerHTML="<main class='wrap'><h1>Shop not found</h1></main>";return}let d=await r.json();business=d.business;products=d.products;document.title=business.name+" — ShopLink Ghana";head.innerHTML="<span class='pill'>ONLINE SHOP</span><h1>"+e(business.name)+"</h1><p>"+e(business.description)+"</p><p class='muted'>📍 "+e(business.location)+" · 🕐 "+e(business.hours)+"</p>";render()}
function render(){let q=search.value.toLowerCase(),a=products.filter(p=>(p.name+" "+p.description).toLowerCase().includes(q));count.textContent=a.length+" products";grid.innerHTML=a.map(p=>"<article class='product'><img src='"+p.image+"' alt='"+e(p.name)+"'><div><h3>"+e(p.name)+"</h3><p>"+e(p.description)+"</p><strong>GH₵"+Number(p.price).toFixed(2)+"</strong><button class='btn full' onclick="add('"+p.id+"')">Add to order</button></div></article>").join("")||"<p>No products found.</p>"}
function add(id){let x=cart.find(a=>a.id===id);x?x.qty++:cart.push({id,qty:1});update()}function update(){let n=cart.reduce((a,x)=>a+x.qty,0),t=cart.reduce((a,x)=>a+x.qty*products.find(p=>p.id===x.id).price,0);cc.textContent=n;total.textContent="GH₵"+t.toFixed(2);cartBar.classList.toggle("hidden",!n)}
function checkout(){let name=prompt("Your name:");if(!name)return;let loc=prompt("Delivery/pickup location:")||"Not provided",m="Hello "+business.name+"! I want to order:%0A%0A",t=0;cart.forEach(x=>{let p=products.find(p=>p.id===x.id);t+=p.price*x.qty;m+=encodeURIComponent(p.name)+" x "+x.qty+" = GH₵"+(p.price*x.qty).toFixed(2)+"%0A"});m+="%0ATotal: GH₵"+t.toFixed(2)+"%0AName: "+encodeURIComponent(name)+"%0ALocation: "+encodeURIComponent(loc);location.href="https://wa.me/"+business.whatsapp+"?text="+m}
function e(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}search.oninput=render;init();
</script></body></html>
